version: '3.8'

services:
  meson-santa-rosa:
    build:
      context: .
      dockerfile: Dockerfile
    image: meson-santa-rosa:latest
    container_name: meson-santa-rosa-web
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - web
    labels:
      - "com.meonsantarosa.description=Mesón Santa Rosa Hotel Boutique Website"
      - "com.meonsantarosa.version=1.0"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  web:
    driver: bridge
